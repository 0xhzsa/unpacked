<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNPACKED — nothing at this depth</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317141B'/%3E%3Ccircle cx='32' cy='25' r='9' fill='%23FF6B8B'/%3E%3Crect x='18' y='40' width='28' height='4' rx='2' fill='%23F2EFE9'/%3E%3Crect x='24' y='48' width='16' height='4' rx='2' fill='%236E6670'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/unpacked/css/fonts.css?v=5">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { color-scheme: dark; --acc: #FF6B8B; }
  html, body { min-height: 100%; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
    background: #0F0D10;
    color: #F2EFE9;
    font-family: "Space Grotesk", system-ui, sans-serif;
    overflow-x: hidden;
  }
  .bg { position: fixed; inset: 0; z-index: 0; }
  .bg img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%;
    filter: saturate(1.05) contrast(1.04) brightness(.56);
    opacity: .85;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(90% 60% at 50% 8%, rgba(255,107,139,.10), transparent 60%),
      linear-gradient(180deg, rgba(15,13,16,.45) 0%, rgba(15,13,16,.72) 52%, #0F0D10 100%);
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    background: rgba(15,13,16,.58);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    padding: clamp(22px, 5.4vw, 32px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .kick {
    display: flex; align-items: center; gap: 9px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; font-weight: 600; letter-spacing: .24em;
    color: var(--acc);
    margin-bottom: 18px;
  }
  .kick i {
    width: 7px; height: 7px; border-radius: 999px;
    background: var(--acc);
    box-shadow: 0 0 12px color-mix(in srgb, var(--acc) 70%, transparent);
  }
  h1 {
    font-family: "Clash Display", "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 8.4vw, 3.2rem);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin-bottom: 16px;
  }
  p {
    font-size: 16px; line-height: 1.62;
    color: rgba(242,239,233,.72);
    max-width: 44ch;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px; font-weight: 700; letter-spacing: .15em;
    text-decoration: none;
    padding: 13px 18px; border-radius: 999px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .btn:active { transform: scale(.985); }
  .primary { background: var(--acc); color: #141118; }
  .ghost { color: #E7E2DE; border: 1px solid rgba(255,255,255,.17); background: rgba(255,255,255,.04); }
  .ghost:hover { border-color: rgba(255,255,255,.34); }
  .foot {
    margin-top: 28px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.09);
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px; letter-spacing: .17em;
    color: #6E6670;
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<div class="bg"><img src="/unpacked/assets/img/room.jpg?v=10" alt=""></div>
<main class="card">
  <div class="kick"><i></i>404 &middot; NOTHING AT THIS DEPTH</div>
  <h1>This address was never in the room.</h1>
  <p>Every line here starts from an ordinary object and ends in the ground. This door opens onto neither &mdash; but the room is still upstairs.</p>
  <div class="btns">
    <a class="btn primary" href="/unpacked/">BACK TO THE ROOM &rarr;</a>
    <a class="btn ghost" href="/unpacked/#/map">TRANSIT MAP</a>
  </div>
  <div class="foot">24 OBJECTS &middot; 153 STATIONS &middot; 15 GROUNDS</div>
</main>
</body>
</html>
