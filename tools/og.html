<style>
  * { margin: 0; padding: 0; }

  body {

    color: #181410;
    font-family: 'Alegreya', serif;
  }
  .frame { position: absolute; inset: 13px; border: 2px solid #181410; }
  .kicker {
    position: absolute; left: 66px; top: 62px;
    font: 700 16px/1 'IBM Plex Mono', monospace; letter-spacing: 0.28em; color: #e0472b;
  }
  .kicker .rule { display: inline-block; width: 44px; height: 0; border-top: 2px solid #e0472b; vertical-align: 4px; margin-right: 14px; }
  h1 {

  }
  .lead {

  }
  .stats {
    position: absolute; left: 68px; top: 420px;
    font: 500 13.5px/1 'IBM Plex Mono', monospace; letter-spacing: 0.14em; color: #5c564c;

  .url {
    position: absolute; left: 68px; bottom: 47px;

  .grid {
    position: absolute; right: 36px; top: 41px; width: 456px;
    display: grid; grid-template-columns: repeat(4, 108px); grid-auto-rows: 104px; gap: 8px;
  }
  .cell { border: 1.5px solid #181410; background-size: cover; background-position: center; }
