<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;600;700&family=Alegreya:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 130% 95% at 45% 0%, rgba(255,250,235,0.55), transparent 62%),
      radial-gradient(ellipse 150% 125% at 50% 115%, rgba(94,72,40,0.2), transparent 66%),
      #e9dec4;
    color: #44321f;
    font-family: 'Alegreya', serif;
  }
  .frame { position: absolute; inset: 13px; border: 2px solid #44321f; }
  .kicker {
    position: absolute; left: 66px; top: 62px;
    font: 700 16px/1 'IBM Plex Mono', monospace; letter-spacing: 0.28em; color: #b65c38;
  }
  .kicker .rule { display: inline-block; width: 44px; height: 0; border-top: 2px solid #b65c38; vertical-align: 4px; margin-right: 14px; }
  h1 {
    position: absolute; left: 66px; top: 88px;
    font-family: 'Alegreya SC', serif; font-weight: 700; font-size: 112px; line-height: 1; letter-spacing: 0.01em;
  }
  .lead {
    position: absolute; left: 68px; top: 226px; width: 520px;
    font: italic 500 25.5px/1.5 'Alegreya', serif; color: #44321f;
  }
  .stats {
    position: absolute; left: 68px; top: 420px;
    font: 500 13.5px/1 'IBM Plex Mono', monospace; letter-spacing: 0.14em; color: #6e5a40;
  }
  .url {
    position: absolute; left: 68px; bottom: 47px;
    font: 700 14.5px/1 'IBM Plex Mono', monospace; letter-spacing: 0.2em; color: #b65c38;
  }
  .grid {
    position: absolute; right: 36px; top: 41px; width: 456px;
    display: grid; grid-template-columns: repeat(3, 146px); grid-auto-rows: 130px; gap: 8px;
  }
  .cell { border: 1.5px solid #44321f; background-size: cover; background-position: center; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="kicker"><span class="rule"></span>AN ENGINEER'S "I, PENCIL", REBUILT</div>
  <h1>UNPACKED</h1>
  <div class="lead">What 11 ordinary things are actually made of &mdash; traced part by part, machine by machine, all the way back to the ground they came from.</div>
  <div class="stats">11 OBJECTS &middot; 106 PROCESSES &middot; 121 LINKS</div>
  <div class="url">0xhzsa.github.io/unpacked</div>
  <div class="grid">
    <div class="cell" style="background-image:url('../assets/img/keyboard.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/lamp.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/chair.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/mug.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/metaldesk.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/glass.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/book.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/fan.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/candle.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/armchair.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/bottle.jpg')"></div>
    <div class="cell" style="background-image:url('../assets/img/room.jpg')"></div>
  </div>
</body>
</html>
